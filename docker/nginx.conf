server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Hide Nginx version
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The service worker file itself (plus its bootstrap script and manifest)
    # must never be cached long-term: it's the ONLY thing that tells a
    # returning browser a new version exists at all. Cached as "immutable" by
    # the regex block below (it also matches plain .js), a phone that already
    # visited once could keep running a service worker from before any fix in
    # this file ever shipped, for up to 30 days, with no way to tell from the
    # outside — exact-match locations always win over regex ones in nginx
    # regardless of file order, so this takes precedence over the block below.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Cache hashed static assets aggressively
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Controle por celular (docs/12-controle-por-celular.md §5): a second,
    # separate entry point (Vite multi-page build outputs controle.html) —
    # matched before the SPA catch-all below so /controle never falls
    # through to the main game's index.html.
    location = /controle {
        try_files /controle.html =404;
        add_header Cache-Control "no-cache";
    }

    # SPA-style fallback for the game entry point
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Never serve dotfiles
    location ~ /\. {
        deny all;
    }
}
