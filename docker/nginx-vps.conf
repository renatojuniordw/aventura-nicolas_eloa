# Configuração do NGINX da VPS (fora do Docker) — proxy reverso para o
# container "aventura-nicolas_eloa", que escuta apenas em 127.0.0.1:65000.
#
# Instalação na VPS:
#   1. sudo cp nginx-vps.conf /etc/nginx/sites-available/game.unificando.com.br.conf
#   2. sudo ln -s /etc/nginx/sites-available/game.unificando.com.br.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Quando for ativar HTTPS:
#   sudo certbot --nginx -d game.unificando.com.br
#   (o certbot reescreve este arquivo automaticamente para redirecionar
#   HTTP -> HTTPS e adicionar os caminhos dos certificados)

limit_req_zone $binary_remote_addr zone=joguinho_rl:10m rate=10r/s;
# Controle por celular (docs/12-controle-por-celular.md §7): the signaling
# socket carries one short "jump" message per real jump, so this is
# deliberately tighter than the general game traffic above.
limit_req_zone $binary_remote_addr zone=joguinho_signaling_rl:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name game.unificando.com.br;

    access_log /var/log/nginx/game.unificando.com.br.access.log;
    error_log  /var/log/nginx/game.unificando.com.br.error.log;

    # Tamanho máximo de upload (não há upload de usuário no jogo, mantém baixo)
    client_max_body_size 1m;

    # Nunca servir arquivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # Servidor de sinalização do controle por celular (docker-compose service
    # "signaling", publicado apenas em 127.0.0.1:65001 — nunca exposto direto
    # na internet). socket.io-client do celular e do jogo conectam aqui, no
    # mesmo domínio/porta 443 que já tem certificado válido.
    location /socket.io/ {
        limit_req zone=joguinho_signaling_rl burst=40 nodelay;

        proxy_pass http://127.0.0.1:65001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket fica aberto por toda a partida — bem mais que o timeout
        # de uma requisição HTTP comum.
        proxy_read_timeout 3600s;
        proxy_connect_timeout 5s;
    }

    location / {
        limit_req zone=joguinho_rl burst=20 nodelay;

        proxy_pass http://127.0.0.1:65000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessário caso o app venha a usar websockets no futuro
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
