services:
  jogo:
    build:
      context: .
      dockerfile: Dockerfile
    image: joguinho-sobrinhos:latest
    container_name: joguinho-sobrinhos
    restart: unless-stopped
    ports:
      # Bind only to loopback: a reverse proxy (nginx) on the VPS itself
      # handles the public interface and forwards to this port.
      - "127.0.0.1:65000:8080"

    # --- Resource limits ---
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 100
        reservations:
          cpus: "0.10"
          memory: 32M
    mem_swappiness: 0

    # --- Security hardening ---
    user: nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
      nproc: 64

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
