<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aventura do Nicolas&Eloá</title>
    <meta
      name="description"
      content="Jogo de plataforma 2D educativo em português: pule, descubra e brinque com letras, sílabas e palavras."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <!-- Game world is rendered on the canvas; menus are accessible DOM overlays. -->
    <div id="app">
      <div class="game-viewport">
        <canvas
          id="game-canvas"
          width="960"
          height="540"
          aria-label="Área do jogo"
        ></canvas>
        <div id="hud-controls-root" class="hud-controls-root"></div>
        <div id="overlay-root" class="overlay-root"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
